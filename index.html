<div class="login-form-wrap">
          <div class="login-box">
            <h2>Welcome back</h2>
            <div class="small">Sign in to access the Remote-Control-Monitor dashboard</div>

            <form>
              <div class="field">
                <label for="username">Username or email</label>
                <input id="username" type="text" placeholder="anon127498@proton.me" />
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter password" />
              </div>

              <div class="helper">
                <div class="check">
                  <input type="checkbox" id="remember" />
                  <label for="remember" style="letter-spacing:0; text-transform:none; color:var(--muted);">Remember me</label>
                </div>
                <span style="color:var(--cyan); cursor:pointer;">Forgot?</span>
              </div>

              <button id="loginBtn" type="button" class="login-btn">Login</button>
            </form>

            <div id="loginError" class="error-box"></div>
          </div>
        </div>
